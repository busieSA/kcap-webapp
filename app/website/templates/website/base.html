<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="{% block meta_description %}KCAP - KwaMashu Community Advancement Projects{% endblock %}"
    >


    <title>
        {% block title %}
            KCAP
        {% endblock %}
    </title>


    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >


    <!-- KCAP Website CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for(
            'website.static',
            filename='css/website.css'
        ) }}"
    >


    {% block styles %}
    {% endblock %}

</head>


<body>


    {% include "website/partials/navbar.html" %}


    <main>

        {% include "website/partials/flash_messages.html" %}


        {% block content %}
        {% endblock %}

    </main>


    {% include "website/partials/footer.html" %}


    <!-- jQuery -->
    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>


    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- KCAP Website -->
    <script
        src="{{ url_for(
            'website.static',
            filename='js/website.js'
        ) }}">
    </script>


    {% block scripts %}
    {% endblock %}


</body>

</html>
